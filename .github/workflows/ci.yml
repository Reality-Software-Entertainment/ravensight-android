name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: JVM tests for the protocol core
        run: ./gradlew :core:test

      - name: Robolectric tests for the Android layer
        run: ./gradlew :ravensight:testDebugUnitTest

      - name: Assemble the Android library
        run: ./gradlew :ravensight:assembleRelease

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            core/build/reports/tests/test
            ravensight/build/reports/tests/testDebugUnitTest
